name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK (cmdline-tools)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar paquetes del SDK necesarios
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Ejecutar pruebas unitarias
        run: gradle test

      - name: Compilar APK de prueba (debug)
        run: gradle assembleDebug

      - name: Preparar archivo APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PagoPeones.apk

      - name: Publicar APK como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Pago Peones - última compilación"
          body: |
            APK generado automáticamente desde el commit ${{ github.sha }}.

            Para instalarlo en el celular:
            1. Abre esta página desde el navegador del celular.
            2. Descarga el archivo `PagoPeones.apk` de abajo.
            3. Ábrelo y, si lo pide, activa "Instalar apps desconocidas" para
               la app que usaste para abrirlo (navegador o Archivos).
            4. Toca Instalar.

            Nota: esta es una compilación de depuración para pruebas rápidas,
            no la versión final firmada y optimizada (ver README para esa).
          files: PagoPeones.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
